# Stage 2: DriveStudio-compatible environment lighting optimization.
trainer:
  tracer:
    use_pbr: true
  render:
    freeze_geometry: true
    freeze_material: true
    freeze_envmap: false
  losses:
    rgb:
      w: 0.8
    ssim:
      w: 0.2
    pbr_rgb:
      w: 0.1
    normal:
      w: 0.3
    normal_cos:
      w: 0.3
    albedo:
      w: 0.5
    roughness:
      w: 0.3
    metallic:
      w: 0.3

