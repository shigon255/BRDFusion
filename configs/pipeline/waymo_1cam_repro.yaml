# BRDFusion Waymo 1-camera reproduction pipeline, synced with run_exp_full_waymo_1cam.sh.
repo_root: .
output_root: work_dirs
config_file: configs/omnire.yaml
# Static preset only. Dataset/path/scene/timestep values are derived by tools/run_pipeline.py CLI.

stage1a_iters: 30000
stage1b_iters: 30000
stage2_iters: 5000
stage3_iters: 20000

scaleinv_w: 0.1
scaleinv_w_final: 0.01
diffuse_light_white_w: 0.001
stage3_stop_split_iters: 15000
stage3_stop_reset_alpha_iters: 15000

gen_refine_strengths: "0.3"
gen_render_strengths: "0.5"

stage3_extra_opts:
  - trainer.tracer.use_ray_error_cache=true
  - trainer.tracer.ray_error_bootstrap_full_render=true
  - trainer.tracer.ray_error_bootstrap_save=true
  - trainer.losses.pbr_rgb.w=0.12
  - trainer.losses.mono_depth.w=0.05
  - trainer.losses.env_scaleinv.w=0.01
  - trainer.losses.depth_tv.w=0.0
  - trainer.losses.depth_normal.w=0.0
  - trainer.losses.normal.w=0.1
  - trainer.losses.normal_cos.w=0.1
  - trainer.losses.albedo.w=0.4
  - trainer.losses.roughness.w=0.1
  - trainer.losses.metallic.w=0.1
  - trainer.losses.diffuse_light_white.w=0.001
  - model.Background.reg.sharp_shape_reg.w=0.1
  - model.RigidNodes.reg.sharp_shape_reg.w=0.1
  - model.DeformableNodes.reg.sharp_shape_reg.w=0.1
  - model.SMPLNodes.reg.shape_reg.w=0.1
  - trainer.gaussian_ctrl_general_cfg.xyz.lr_final=0.0001
  - trainer.gaussian_ctrl_general_cfg.opacity.lr_final=0.005
  - trainer.gaussian_ctrl_general_cfg.scaling.lr_final=0.005
  - trainer.gaussian_ctrl_general_cfg.rotation.lr_final=0.005
  - trainer.gaussian_ctrl_general_cfg.normal.lr_final=0.0001
  - trainer.gaussian_ctrl_general_cfg.albedo.lr_final=0.0001
  - trainer.gaussian_ctrl_general_cfg.roughness.lr_final=0.0001
  - trainer.gaussian_ctrl_general_cfg.metallic.lr_final=0.0001
  - model.Sky.optim.all.lr=0.00001

diffusion_renderer_root: third_party/cosmos1-diffusion-renderer

render_targets:
  recon:
    enabled: true
  relight:
    enabled: false
  shifted_recon:
    enabled: false
  shifted_relight:
    enabled: false

stages:
  - train
  - render
  - gen_render
  - compute_metrics
