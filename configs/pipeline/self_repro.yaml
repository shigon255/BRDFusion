# Example BRDFusion research reproduction pipeline.
repo_root: .
output_root: work_dirs
project: brdfusion
config_file: configs/omnire.yaml
dataset: self/brdfusion_3cams
data_root: data/brdfusion/self/scenes
scene_idx: path1_qwantani_moon_noon_puresky_4k
start_timestep: 0
end_timestep: 50
test_image_stride: 10
cam_ids: "0 1 2"

env:
  conda_root: /home_nfs/yi-ray/miniconda3/envs
  main: brdfusion
  diffusion_renderer: cosmos-predict1
  diffusion_light: diffusionlight
  segformer: segformer

diffusion_renderer_root: third_party/cosmos1-diffusion-renderer
diffusion_light_root: third_party/DiffusionLight-Turbo

stages:
  - check_data
  - inverse_prior_initial
  - light_prior
  - train_stage1a
  - gen_refine_intrinsics
  - train_stage1b
  - train_stage2_light
  - train_stage3_finetune
  - render_eval
  - gen_render
  - compute_metrics
